name: 清理工作流记录
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: 批量删除工作流记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow_patterns: ""
          retain_days: 0
          keep_minimum_runs: 0