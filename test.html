<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- 声明字符编码，防止中文乱码 -->
    <meta charset="UTF-8">
    <!-- 移动端适配：视口宽度等于设备宽度，初始缩放1倍 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站点导航主页</title>
    <style>
        /* 全局重置：清除浏览器默认边距和盒模型计算方式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 页面整体样式：渐变背景，最小高度占满整个屏幕 */
        body {
            background: linear-gradient(135deg, # 0667eea 0%, # 0764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            /* 给固定在顶部的页眉留出空间 */
            padding-top: 70px;
        }
        
        /* ========== 页眉（顶部导航栏） ========== */
        /* 固定在页面顶部，宽度全屏 */
        header.site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: rgba(255, 255, 255, 0.95);
            /* 毛玻璃效果（兼容现代浏览器） */
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            /* 让内容垂直居中，两端对齐 */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            /* 保证页眉在最上层 */
            z-index: 1000;
        }
        
        /* 页眉logo/标题样式 */
        .header-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: # 02d3748;
        }
        
        /* ========== 汉堡菜单按钮 ========== */
        .hamburger-btn {
            /* 去掉按钮默认样式 */
            width: 36px;
            height: 28px;
            position: relative;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
        }
        
        /* 汉堡按钮的三条杠：统一样式 */
        .hamburger-btn span {
            position: absolute;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: # 02d3748;
            border-radius: 2px;
            /* 添加过渡动画，展开收起更丝滑 */
            transition: all 0.3s ease;
        }
        
        /* 分别定位三条杠的位置 */
        .hamburger-btn span:nth-child(1) { top: 0; }
        .hamburger-btn span:nth-child(2) { top: 50%; transform: translateY(-50%); }
        .hamburger-btn span:nth-child(3) { bottom: 0; }
        
        /* 菜单激活（展开）时，三条杠转成叉号 */
        .hamburger-btn.active span:nth-child(1) {
            top: 50%;
            transform: rotate(45deg) translateY(-50%);
        }
        .hamburger-btn.active span:nth-child(2) { opacity: 0; } /* 中间条隐藏 */
        .hamburger-btn.active span:nth-child(3) {
            bottom: 50%;
            transform: rotate(-45deg) translateY(50%);
        }
        
        /* ========== 侧边弹出汉堡菜单 ========== */
        /* 默认在屏幕左侧外隐藏，点击后滑入 */
        .sidebar-menu {
            position: fixed;
            top: 64px;
            left: -280px;
            width: 280px;
            height: calc(100vh - 64px);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
            transition: left 0.3s ease; /* 滑动动画 */
            z-index: 999;
            padding: 20px 0;
        }
        
        /* 菜单展开时，向左移入屏幕 */
        .sidebar-menu.active { left: 0; }
        
        /* 侧边菜单条目样式 */
        .menu-item {
            display: block;
            padding: 14px 24px;
            color: # 02d3748;
            text-decoration: none;
            font-size: 1.05rem;
            transition: background 0.2s;
        }
        /* 鼠标悬浮高亮 */
        .menu-item:hover { background: #f7fafc; }
        /* 分割线，分隔不同分类菜单 */
        .menu-divider {
            height: 1px;
            background: #e2e8f0;
            margin: 8px 16px;
        }
        
        /* ========== 遮罩层 ========== */
        /* 菜单展开后，背景变暗，点击遮罩关闭菜单 */
        .mask {
            position: fixed;
            top: 64px;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 998;
        }
        /* 菜单展开时显示遮罩 */
        .mask.active {
            opacity: 1;
            visibility: visible;
        }
        
        /* ========== 主体内容：导航卡片区域 ========== */
        .container {
            /* 限制最大宽度，居中显示，两边留边适配移动端 */
            max-width: 1100px;
            width: 92%;
            margin: 30px auto 60px;
        }
        
        /* 页面欢迎标题 */
        .page-title {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .page-title h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        .page-title p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }
        
        /* 卡片分组容器 */
        .card-group {
            margin-bottom: 40px;
        }
        /* 分组标题 */
        .group-title {
            color: white;
            font-size: 1.4rem;
            margin-bottom: 20px;
            padding-left: 10px;
            border-left: 4px solid white;
        }
        
        /* 卡片网格布局：自动适配屏幕宽度，最小180px一张卡片 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        
        /* 跳转卡片基础样式 */
        .nav-card {
            background: white;
            border-radius: 12px;
            padding: 24px 20px;
            text-decoration: none;
            color: # 02d3748;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            /* 悬浮上浮动画过渡 */
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        /* 鼠标悬浮效果 */
        .nav-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.15);
        }
        
        /* 卡片标题 */
        .nav-card h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
        }
        /* 卡片描述 */
        .nav-card p {
            font-size: 0.9rem;
            color: # 0718096;
            line-height: 1.5;
        }
        
        /* 页脚版权信息 */
        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            padding-bottom: 40px;
            font-size: 0.9rem;
        }
        
        /* ========== 移动端适配 ========== */
        @media (max-width: 480px) {
            .page-title h1 { font-size: 1.8rem; }
            .card-grid { grid-template-columns: 1fr; } /* 移动端单列显示卡片 */
        }
    </style>
</head>

<body>
    <!-- 顶部页眉 -->
    <header class="site-header">
        <div class="header-title">我的导航站</div>
        <!-- 汉堡菜单按钮：三个span对应三条横杠 -->
        <button class="hamburger-btn" id="hamburgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- 侧边弹出汉堡菜单 -->
    <aside class="sidebar-menu" id="sidebarMenu">
        <a href="#" class="menu-item">首页</a>
        <a href="#" class="menu-item">关于本站</a>
        <div class="menu-divider"></div>
        <!-- 已经优先保留GitHub相关入口 -->
        <a href="https://github.com" target="_blank" class="menu-item">GitHub</a>
        <a href="https://gist.github.com" target="_blank" class="menu-item">GitHub Gist</a>
        <div class="menu-divider"></div>
        <a href="#" class="menu-item">收藏夹</a>
        <a href="#" class="menu-item">设置</a>
    </aside>

    <!-- 遮罩层：菜单展开后显示，点击关闭菜单 -->
    <div class="mask" id="mask"></div>

    <!-- 主体内容 -->
    <main class="container">
        <div class="page-title">
            <h1>欢迎来到我的导航站</h1>
            <p>快速访问我的所有子站点和常用工具</p>
        </div>

        <!-- 开发相关分组卡片 -->
        <section class="card-group">
            <h2 class="group-title">开发工具</h2>
            <div class="card-grid">
                <a href="https://github.com" target="_blank" class="nav-card">
                    <h3>GitHub</h3>
                    <p>代码托管与项目协作平台</p>
                </a>
                <a href="https://leetcode.cn" target="_blank" class="nav-card">
                    <h3>力扣</h3>
                    <p>算法刷题与面试准备</p>
                </a>
                <a href="https://www.figma.com" target="_blank" class="nav-card">
                    <h3>Figma</h3>
                    <p>在线UI设计协作工具</p>
                </a>
            </div>
        </section>

        <!-- 我的项目分组卡片 -->
        <section class="card-group">
            <h2 class="group-title">我的子站点</h2>
            <div class="card-grid">
                <a href="#" target="_blank" class="nav-card">
                    <h3>博客站点</h3>
                    <p>技术分享与日常记录</p>
                </a>
                <a href="#" target="_blank" class="nav-card">
                    <h3>图片画廊</h3>
                    <p>摄影作品展示站点</p>
                </a>
                <a href="#" target="_blank" class="nav-card">
                    <h3>在线工具集</h3>
                    <p>自用实用工具集合</p>
                </a>
            </div>
        </section>

        <!-- 日常站点分组卡片 -->
        <section class="card-group">
            <h2 class="group-title">常用网站</h2>
            <div class="card-grid">
                <a href="https://www.bilibili.com" target="_blank" class="nav-card">
                    <h3>Bilibili</h3>
                    <p>弹幕视频分享网站</p>
                </a>
                <a href="https://music.163.com" target="_blank" class="nav-card">
                    <h3>网易云音乐</h3>
                    <p>发现好音乐</p>
                </a>
                <a href="https://www.zhihu.com" target="_blank" class="nav-card">
                    <h3>知乎</h3>
                    <p>知识分享社区</p>
                </a>
            </div>
        </section>
</body>

</html>
