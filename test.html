<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- 声明字符编码，防止中文乱码 -->
    <meta charset="UTF-8">
    <!-- 移动端适配：视口宽度等于设备宽度，初始缩放1倍 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站点导航主页</title>
    <link href="css/base.css" rel="stylesheet">
</head>

<body>
    <canvas id="particleCanvas"></canvas>
    <!-- 顶部页眉 -->
    <header class="site-header">
        <div class="header-title">首页</div>
        <!-- 汉堡菜单按钮：三个span对应三条横杠 -->
        <button class="hamburger-btn" id="hamburgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- 侧边弹出汉堡菜单 -->
    <aside class="sidebar-menu" id="sidebarMenu">
        <a href="#" class="menu-item">首页</a>
        <a href="#" class="menu-item">关于本站</a>
        <div class="menu-divider"></div>
        <!-- 已经优先保留GitHub相关入口 -->
        <a href="https://github.com" target="_blank" class="menu-item">GitHub</a>
        <a href="https://gist.github.com" target="_blank" class="menu-item">GitHub Gist</a>
        <div class="menu-divider"></div>
        <a href="#" class="menu-item">收藏夹</a>
        <a href="#" class="menu-item">设置</a>
    </aside>

    <!-- 遮罩层：菜单展开后显示，点击关闭菜单 -->
    <div class="mask" id="mask"></div>

    <!-- 主体内容 -->
    <main class="container">
        <div class="page-title">
            <h1>Hi</h1>
            <p>导航目录</p>
        </div>

        <!-- 开发相关分组卡片 -->
        <section class="card-group">
            <h2 class="group-title">开发工具</h2>
            <div class="card-grid">
                <a href="https://github.com" target="_blank" class="nav-card">
                    <h3>GitHub</h3>
                    <p>代码托管与项目协作平台</p>
                </a>
                <a href="https://leetcode.cn" target="_blank" class="nav-card">
                    <h3>力扣</h3>
                    <p>算法刷题与面试准备</p>
                </a>
                <a href="https://www.figma.com" target="_blank" class="nav-card">
                    <h3>Figma</h3>
                    <p>在线UI设计协作工具</p>
                </a>
            </div>
        </section>

        <!-- 我的项目分组卡片 -->
        <section class="card-group">
            <h2 class="group-title">我的子站点</h2>
            <div class="card-grid">
                <a href="#" target="_blank" class="nav-card">
                    <h3>博客站点</h3>
                    <p>技术分享与日常记录</p>
                </a>
                <a href="#" target="_blank" class="nav-card">
                    <h3>图片画廊</h3>
                    <p>摄影作品展示站点</p>
                </a>
                <a href="#" target="_blank" class="nav-card">
                    <h3>在线工具集</h3>
                    <p>自用实用工具集合</p>
                </a>
            </div>
        </section>

        <!-- 日常站点分组卡片 -->
        <section class="card-group">
            <h2 class="group-title">常用网站</h2>
            <div class="card-grid">
                <a href="https://www.bilibili.com" target="_blank" class="nav-card">
                    <h3>Bilibili</h3>
                    <p>弹幕视频分享网站</p>
                </a>
                <a href="https://music.163.com" target="_blank" class="nav-card">
                    <h3>网易云音乐</h3>
                    <p>发现好音乐</p>
                </a>
                <a href="https://www.zhihu.com" target="_blank" class="nav-card">
                    <h3>知乎</h3>
                    <p>知识分享社区</p>
                </a>
            </div>
        </section>
        <script src="js/particle.js?id=particleCanvas"></script>
</body>

</html>
